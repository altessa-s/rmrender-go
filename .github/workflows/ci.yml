name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  macos:
    name: macos / ${{ matrix.backend }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # CoreGraphics is the darwin default; the rmrender_cairo build tag
        # selects the Cairo backend, which Linux uses.
        backend: [coregraphics, cairo]
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install the Cairo stack and PDFium
        if: matrix.backend == 'cairo'
        run: |
          brew install cairo pango fontconfig harfbuzz gdk-pixbuf pkgconf
          arch=$(uname -m | sed 's/x86_64/x64/')
          python3 internal/clib/rmrender/scripts/fetch-pdfium.py --platform "mac-$arch" --output "$RUNNER_TEMP/pdfium"
          echo "CGO_CFLAGS=-I$RUNNER_TEMP/pdfium/include" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L$RUNNER_TEMP/pdfium/lib -Wl,-rpath,$RUNNER_TEMP/pdfium/lib" >> "$GITHUB_ENV"
          echo "GOFLAGS=-tags=rmrender_cairo" >> "$GITHUB_ENV"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Test with full cgo pointer checks
        run: GOEXPERIMENT=cgocheck2 go test -count=1 ./...

      - name: Fuzz page drawing briefly
        run: go test -run='^$' -fuzz=FuzzPage -fuzztime=20s .

      - name: Link beside rmlines-go, rmdoc-go and rmmarks-go
        run: go -C internal/coexist test -count=1 ./...

  linux:
    name: linux / ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # Debian 13 ships clang 19, the oldest clang that reads the vendored C23,
    # and the Cairo stack rmrender-lib is tested with.
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      CGO_ENABLED: "1"
      CC: clang
    steps:
      - name: Install the compiler and the Cairo stack
        run: |
          apt-get update
          apt-get install -y ca-certificates git clang pkg-config python3 libcairo2-dev libpango1.0-dev \
              libharfbuzz-dev libgdk-pixbuf-2.0-dev libfontconfig1-dev zlib1g-dev
          clang --version | head -1

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Fetch PDFium
        run: |
          python3 internal/clib/rmrender/scripts/fetch-pdfium.py --platform linux-${{ matrix.arch }} --output "$RUNNER_TEMP/pdfium"
          echo "CGO_CFLAGS=-I$RUNNER_TEMP/pdfium/include" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L$RUNNER_TEMP/pdfium/lib -Wl,-rpath,$RUNNER_TEMP/pdfium/lib" >> "$GITHUB_ENV"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Test with full cgo pointer checks
        run: GOEXPERIMENT=cgocheck2 go test -count=1 ./...

      - name: Fuzz page drawing briefly
        run: go test -run='^$' -fuzz=FuzzPage -fuzztime=20s .

      - name: Link beside rmlines-go, rmdoc-go and rmmarks-go
        run: go -C internal/coexist test -count=1 ./...

  windows:
    name: windows / ${{ matrix.arch }}
    # The Cairo backend as rmrender-lib's Windows CI builds it: MSYS2 CLANG64
    # or CLANGARM64 (clang, the Cairo stack, pkg-config) and the PDFium SDK.
    # Go's race detector has no windows/arm64 port, so arm64 tests without it.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-2022, msystem: CLANG64, pkg: mingw-w64-clang-x86_64, race: "-race" }
          - { arch: arm64, runner: windows-11-arm, msystem: CLANGARM64, pkg: mingw-w64-clang-aarch64, race: "" }
    permissions:
      contents: read
    defaults:
      run:
        shell: msys2 {0}
    env:
      CGO_ENABLED: "1"
      CC: clang
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          # The Go that setup-go installed, after the environment's clang and
          # pkg-config.
          path-type: inherit
          install: >-
            ${{ matrix.pkg }}-clang
            ${{ matrix.pkg }}-pkgconf
            ${{ matrix.pkg }}-python
            ${{ matrix.pkg }}-cairo
            ${{ matrix.pkg }}-pango
            ${{ matrix.pkg }}-fontconfig
            ${{ matrix.pkg }}-harfbuzz
            ${{ matrix.pkg }}-gdk-pixbuf2
            ${{ matrix.pkg }}-zlib
            ${{ matrix.pkg }}-ntldd

      - name: Fetch PDFium
        run: |
          clang --version | head -1
          go version
          # Mixed paths (C:/...): clang, Go and the test binaries are native
          # Windows programs. The script checks the archive's SHA-256.
          pdfium="$(cygpath -m "$RUNNER_TEMP")/pdfium"
          python internal/clib/rmrender/scripts/fetch-pdfium.py --platform win-${{ matrix.arch }} --output "$pdfium"
          echo "CGO_CFLAGS=-I$pdfium/include" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L$pdfium/lib" >> "$GITHUB_ENV"
          # pdfium.dll is loaded from PATH; the environment's bin, with the Cairo
          # stack's DLLs, is already on it.
          echo "PDFIUM_BIN=$(cygpath -u "$pdfium")/bin" >> "$GITHUB_ENV"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: |
          export PATH="$PDFIUM_BIN:$PATH"
          go test ${{ matrix.race }} -count=1 ./...

      - name: Test with full cgo pointer checks
        run: |
          export PATH="$PDFIUM_BIN:$PATH"
          GOEXPERIMENT=cgocheck2 go test -count=1 ./...

      - name: Link beside rmlines-go, rmdoc-go and rmmarks-go
        run: |
          export PATH="$PDFIUM_BIN:$PATH"
          go -C internal/coexist test -count=1 ./...

      - name: DLLs a program needs
        run: |
          export PATH="$PDFIUM_BIN:$PATH"
          go test -c -o rmrender.test.exe .
          # What a program built with the package loads besides Windows's
          # own: the MSYS2 environment's Cairo stack and pdfium.dll.
          ntldd -R rmrender.test.exe | grep -v -i -E 'windows|system32' | sort

  lint:
    # The CoreGraphics backend type-checks with nothing to install.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
