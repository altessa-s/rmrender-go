version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
  settings:
    gocritic:
      disabled-checks:
        # Fires on the code cgo generates for a C call, not on the source.
        - dupSubExpr
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
